<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d">
  <title id="t">Architecture MCP Office Machine</title>
  <desc id="d">MCP entre OpenWebUI et AWS ; URL signée à portée limitée pour l'utilisateur.</desc>
<defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#fffcf6; }
      .b { fill:#f4f0e6; stroke:#111; stroke-width:2; }
      .hi { fill:#fff; stroke:#111; stroke-width:2.4; }
      .out { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .plane { fill:none; stroke:#111; stroke-width:1.8; stroke-dasharray:7 5; }
      .cloud { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .title { font-family:Segoe UI,system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.08em; fill:#111; }
      .lab { font-family:Segoe UI,system-ui,sans-serif; font-size:14.5px; font-weight:800; fill:#111; }
      .sub { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:500; fill:#3a3a3a; }
      .cap { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; fill:#111; }
      .line {
        stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#a);
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.ingest {
        stroke-dasharray: 4 16;
        animation: flow 1.7s linear infinite;
      }
      .line.return {
        stroke-dasharray: 10 8;
        animation: flow 0.85s linear infinite;
      }
      .line.stem {
        marker-end: none;
        stroke-dasharray: 9 11;
        animation: flow 1.05s linear infinite;
      }
      .hi.pulse {
        animation: node-pulse 2.6s ease-in-out infinite;
      }
      .lbl.flow-lbl {
        animation: lbl-pulse 2.2s ease-in-out infinite;
      }
      .lbl { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#111; }
      .foot { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:600; fill:#3a3a3a; }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes node-pulse {
        0%, 100% { stroke-width: 2.4; }
        50% { stroke-width: 3.4; }
      }
      @keyframes lbl-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .line.ingest, .line.return, .line.stem, .hi.pulse, .lbl.flow-lbl { animation: none; }
        .line, .line.ingest, .line.return, .line.stem { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="560" height="440"/>

  <text x="24" y="32" class="title">OPENWEBUI - MCP - AWS</text>

  <rect class="b" x="32" y="78" width="132" height="72" rx="10"/>
  <text x="98" y="108" text-anchor="middle" class="lab">OpenWebUI</text>
  <text x="98" y="128" text-anchor="middle" class="sub">prompt / chat utilisateur</text>
  <line class="line" x1="164" y1="114" x2="206" y2="114"/>

  <rect class="hi pulse" x="210" y="62" width="132" height="104" rx="10"/>
  <text x="276" y="98" text-anchor="middle" class="lab">Couche MCP</text>
  <text x="276" y="120" text-anchor="middle" class="sub">Outils Office</text>
  <text x="276" y="140" text-anchor="middle" class="sub">pptx / docx / xlsx</text>
  <line class="line" x1="342" y1="114" x2="386" y2="114"/>

  <rect class="cloud" x="390" y="52" width="140" height="196" rx="12"/>
  <text x="408" y="78" class="cap">AWS</text>
  <rect class="b" x="408" y="94" width="104" height="40" rx="8"/>
  <text x="460" y="120" text-anchor="middle" class="lab">Bedrock</text>
  <rect class="b" x="408" y="146" width="104" height="40" rx="8"/>
  <text x="460" y="172" text-anchor="middle" class="lab">S3</text>
  <rect class="b" x="408" y="198" width="104" height="30" rx="8"/>
  <text x="460" y="218" text-anchor="middle" class="sub">+ autres services</text>

  <path class="line return" d="M460 248 V330 H352"/>
  <text x="404" y="318" text-anchor="middle" class="lbl flow-lbl">URL signée (auth limitée)</text>

  <rect class="hi pulse" x="32" y="302" width="320" height="64" rx="10"/>
  <text x="192" y="330" text-anchor="middle" class="lab">Retour OpenWebUI</text>
  <text x="192" y="350" text-anchor="middle" class="sub">voir / télécharger seulement ce que vous avez créé</text>

  <text x="32" y="408" class="foot">Le MCP s'intercale entre le chat et AWS - le résultat revient dans le chat.</text>

</svg>
