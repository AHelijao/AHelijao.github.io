<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d">
  <title id="t">Architecture Ronin</title>
  <desc id="d">Le desktop utilise une IA locale ; Android appelle une API LLM cloud. Glossaire partagé de termes protégés.</desc>
<defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#fffcf6; }
      .b { fill:#f4f0e6; stroke:#111; stroke-width:2; }
      .hi { fill:#fff; stroke:#111; stroke-width:2.4; }
      .out { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .plane { fill:none; stroke:#111; stroke-width:1.8; stroke-dasharray:7 5; }
      .cloud { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .title { font-family:Segoe UI,system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.08em; fill:#111; }
      .lab { font-family:Segoe UI,system-ui,sans-serif; font-size:14.5px; font-weight:800; fill:#111; }
      .sub { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:500; fill:#3a3a3a; }
      .cap { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; fill:#111; }
      .line {
        stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#a);
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.ingest {
        stroke-dasharray: 4 16;
        animation: flow 1.7s linear infinite;
      }
      .line.return {
        stroke-dasharray: 10 8;
        animation: flow 0.85s linear infinite;
      }
      .line.stem {
        marker-end: none;
        stroke-dasharray: 9 11;
        animation: flow 1.05s linear infinite;
      }
      .hi.pulse {
        animation: node-pulse 2.6s ease-in-out infinite;
      }
      .lbl.flow-lbl {
        animation: lbl-pulse 2.2s ease-in-out infinite;
      }
      .lbl { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#111; }
      .foot { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:600; fill:#3a3a3a; }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes node-pulse {
        0%, 100% { stroke-width: 2.4; }
        50% { stroke-width: 3.4; }
      }
      @keyframes lbl-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .line.ingest, .line.return, .line.stem, .hi.pulse, .lbl.flow-lbl { animation: none; }
        .line, .line.ingest, .line.return, .line.stem { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="560" height="440"/>

  <text x="24" y="32" class="title">DEUX COQUES / GLOSSAIRE PARTAGÉ</text>

  <rect class="out" x="24" y="52" width="248" height="300" rx="14"/>
  <text x="40" y="80" class="cap">DESKTOP - IA LOCALE</text>
  <rect class="b" x="48" y="98" width="200" height="52" rx="10"/>
  <text x="148" y="122" text-anchor="middle" class="lab">Interface desktop</text>
  <text x="148" y="140" text-anchor="middle" class="sub">Python / UI légère</text>
  <line class="line" x1="148" y1="150" x2="148" y2="186"/>
  <rect class="b" x="48" y="186" width="200" height="52" rx="10"/>
  <text x="148" y="210" text-anchor="middle" class="lab">Filtre glossaire</text>
  <text x="148" y="228" text-anchor="middle" class="sub">termes à préserver</text>
  <line class="line" x1="148" y1="238" x2="148" y2="274"/>
  <rect class="hi" x="48" y="274" width="200" height="48" rx="10"/>
  <text x="148" y="304" text-anchor="middle" class="lab">LLM local</text>

  <rect class="out" x="288" y="52" width="248" height="300" rx="14"/>
  <text x="304" y="80" class="cap">ANDROID - LLM CLOUD</text>
  <rect class="b" x="312" y="98" width="200" height="52" rx="10"/>
  <text x="412" y="122" text-anchor="middle" class="lab">Interface Android</text>
  <text x="412" y="140" text-anchor="middle" class="sub">Kotlin / portable</text>
  <line class="line" x1="412" y1="150" x2="412" y2="186"/>
  <rect class="b" x="312" y="186" width="200" height="52" rx="10"/>
  <text x="412" y="210" text-anchor="middle" class="lab">Filtre glossaire</text>
  <text x="412" y="228" text-anchor="middle" class="sub">mêmes termes protégés</text>
  <line class="line" x1="412" y1="238" x2="412" y2="274"/>
  <rect class="hi" x="312" y="274" width="200" height="48" rx="10"/>
  <text x="412" y="304" text-anchor="middle" class="lab">API LLM cloud</text>

  <rect class="b" x="80" y="374" width="400" height="36" rx="8"/>
  <text x="280" y="397" text-anchor="middle" class="foot">Glossaire = liste de termes qui ne doivent pas changer</text>

</svg>
