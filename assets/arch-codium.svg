<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d">
  <title id="t">Codium Red architecture</title>
  <desc id="d">Intelligence plane plans; Kali pentest engine executes; human approves, reviews, controls.</desc>
<defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#fffcf6; }
      .b { fill:#f4f0e6; stroke:#111; stroke-width:2; }
      .hi { fill:#fff; stroke:#111; stroke-width:2.4; }
      .out { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .plane { fill:none; stroke:#111; stroke-width:1.8; stroke-dasharray:7 5; }
      .cloud { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .title { font-family:Segoe UI,system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.08em; fill:#111; }
      .lab { font-family:Segoe UI,system-ui,sans-serif; font-size:14.5px; font-weight:800; fill:#111; }
      .sub { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:500; fill:#3a3a3a; }
      .cap { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; fill:#111; }
      .line {
        stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#a);
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.ingest {
        stroke-dasharray: 4 16;
        animation: flow 1.7s linear infinite;
      }
      .line.return {
        stroke-dasharray: 10 8;
        animation: flow 0.85s linear infinite;
      }
      .line.stem {
        marker-end: none;
        stroke-dasharray: 9 11;
        animation: flow 1.05s linear infinite;
      }
      .hi.pulse {
        animation: node-pulse 2.6s ease-in-out infinite;
      }
      .lbl.flow-lbl {
        animation: lbl-pulse 2.2s ease-in-out infinite;
      }
      .lbl { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#111; }
      .foot { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:600; fill:#3a3a3a; }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes node-pulse {
        0%, 100% { stroke-width: 2.4; }
        50% { stroke-width: 3.4; }
      }
      @keyframes lbl-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .line.ingest, .line.return, .line.stem, .hi.pulse, .lbl.flow-lbl { animation: none; }
        .line, .line.ingest, .line.return, .line.stem { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="560" height="440"/>

  <text x="24" y="32" class="title">PLANES + FULL HUMAN CONTROL</text>

  <rect class="hi" x="400" y="56" width="136" height="312" rx="12"/>
  <text x="468" y="96" text-anchor="middle" class="lab">Human</text>
  <text x="468" y="118" text-anchor="middle" class="lab">in the loop</text>
  <text x="468" y="160" text-anchor="middle" class="sub">approves</text>
  <text x="468" y="184" text-anchor="middle" class="sub">reviews</text>
  <text x="468" y="208" text-anchor="middle" class="sub">controls</text>
  <text x="468" y="248" text-anchor="middle" class="lbl">every step</text>
  <text x="468" y="288" text-anchor="middle" class="sub">agent never</text>
  <text x="468" y="310" text-anchor="middle" class="sub">acts alone</text>

  <rect class="plane" x="24" y="56" width="352" height="120" rx="14"/>
  <text x="40" y="84" class="cap">INTELLIGENCE PLANE</text>
  <rect class="b" x="44" y="100" width="148" height="54" rx="10"/>
  <text x="118" y="124" text-anchor="middle" class="lab">Agentic planner</text>
  <text x="118" y="142" text-anchor="middle" class="sub">structure / next steps</text>
  <rect class="b" x="208" y="100" width="148" height="54" rx="10"/>
  <text x="282" y="124" text-anchor="middle" class="lab">Reports / method</text>
  <text x="282" y="142" text-anchor="middle" class="sub">OWASP-oriented</text>

  <line class="line" x1="200" y1="176" x2="200" y2="220"/>
  <text x="212" y="206" class="lbl">gated command bridge</text>

  <rect class="plane" x="24" y="220" width="352" height="148" rx="14"/>
  <text x="40" y="248" class="cap">EXECUTION PLANE</text>
  <rect class="hi" x="44" y="268" width="312" height="72" rx="10"/>
  <text x="200" y="300" text-anchor="middle" class="lab">Kali pentest engine</text>
  <text x="200" y="322" text-anchor="middle" class="sub">isolated execution environment</text>

  <text x="24" y="408" class="foot">Human gates planning and execution. No unsupervised offensive actions.</text>

</svg>
