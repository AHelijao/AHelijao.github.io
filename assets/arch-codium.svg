<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="t d">
  <title id="t">Codium Red architecture</title>
  <desc id="d">Intelligence plane plans; Kali pentest engine executes; human-in-the-loop highlighted under the schema.</desc>
<defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#fffcf6; }
      .b { fill:#f4f0e6; stroke:#111; stroke-width:2; }
      .hi { fill:#fff; stroke:#111; stroke-width:2.4; }
      .out { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .plane { fill:none; stroke:#111; stroke-width:1.8; stroke-dasharray:7 5; }
      .cloud { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .title { font-family:Segoe UI,system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.08em; fill:#111; }
      .lab { font-family:Segoe UI,system-ui,sans-serif; font-size:14.5px; font-weight:800; fill:#111; }
      .sub { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:500; fill:#3a3a3a; }
      .cap { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; fill:#111; }
      .line {
        stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#a);
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.ingest {
        stroke-dasharray: 4 16;
        animation: flow 1.7s linear infinite;
      }
      .line.return {
        stroke-dasharray: 10 8;
        animation: flow 0.85s linear infinite;
      }
      .line.stem {
        marker-end: none;
        stroke-dasharray: 9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.gate {
        stroke-dasharray: 5 7;
        animation: flow 1.2s linear infinite;
      }
      .hi.pulse {
        animation: node-pulse 2.6s ease-in-out infinite;
      }
      .lbl.flow-lbl {
        animation: lbl-pulse 2.2s ease-in-out infinite;
      }
      .chip { fill:#fff; stroke:#111; stroke-width:1.6; }
      .lbl { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#111; }
      .foot { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:600; fill:#3a3a3a; }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes node-pulse {
        0%, 100% { stroke-width: 2.4; }
        50% { stroke-width: 3.4; }
      }
      @keyframes lbl-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .line.ingest, .line.return, .line.stem, .line.gate, .hi.pulse, .lbl.flow-lbl { animation: none; }
        .line, .line.ingest, .line.return, .line.stem, .line.gate { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="560" height="500"/>

  <text x="24" y="34" class="title">PLANES + FULL HUMAN CONTROL</text>

  <rect class="plane" x="56" y="64" width="448" height="130" rx="14"/>
  <text x="72" y="92" class="cap">INTELLIGENCE PLANE</text>
  <rect class="b" x="88" y="108" width="180" height="60" rx="10"/>
  <text x="178" y="134" text-anchor="middle" class="lab">Agentic planner</text>
  <text x="178" y="152" text-anchor="middle" class="sub">structure / next steps</text>
  <rect class="b" x="292" y="108" width="180" height="60" rx="10"/>
  <text x="382" y="134" text-anchor="middle" class="lab">Reports / method</text>
  <text x="382" y="152" text-anchor="middle" class="sub">OWASP-oriented</text>

  <line class="line" x1="280" y1="194" x2="280" y2="246"/>
  <text x="292" y="228" class="lbl">gated command bridge</text>

  <rect class="plane" x="56" y="246" width="448" height="140" rx="14"/>
  <text x="72" y="276" class="cap">EXECUTION PLANE</text>
  <rect class="hi" x="88" y="294" width="384" height="68" rx="10"/>
  <text x="280" y="324" text-anchor="middle" class="lab">Kali pentest engine</text>
  <text x="280" y="344" text-anchor="middle" class="sub">isolated execution environment</text>

  <rect class="hi pulse" x="56" y="412" width="448" height="52" rx="12"/>
  <text x="280" y="434" text-anchor="middle" class="lab">Human in the loop</text>
  <text x="280" y="452" text-anchor="middle" class="sub">approves · reviews · controls every step — agent never acts alone</text>

</svg>
