<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-labelledby="t d">
  <title id="t">Repo Analyzer architecture</title>
  <desc id="d">Full AI flow with n8n; worker scans code; only the structured report reaches the model.</desc>
<defs>
    <marker id="a" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 Z" fill="#111"/>
    </marker>
    <style>
      .bg { fill:#fffcf6; }
      .b { fill:#f4f0e6; stroke:#111; stroke-width:2; }
      .hi { fill:#fff; stroke:#111; stroke-width:2.4; }
      .out { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .plane { fill:none; stroke:#111; stroke-width:1.8; stroke-dasharray:7 5; }
      .cloud { fill:none; stroke:#111; stroke-width:1.6; stroke-dasharray:6 5; }
      .title { font-family:Segoe UI,system-ui,sans-serif; font-size:15px; font-weight:800; letter-spacing:0.08em; fill:#111; }
      .lab { font-family:Segoe UI,system-ui,sans-serif; font-size:14.5px; font-weight:800; fill:#111; }
      .sub { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:500; fill:#3a3a3a; }
      .cap { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:800; letter-spacing:0.12em; fill:#111; }
      .line {
        stroke:#111; stroke-width:2.2; fill:none; marker-end:url(#a);
        stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray:9 11;
        animation: flow 1.05s linear infinite;
      }
      .line.ingest {
        stroke-dasharray: 4 16;
        animation: flow 1.7s linear infinite;
      }
      .line.return {
        stroke-dasharray: 10 8;
        animation: flow 0.85s linear infinite;
      }
      .line.stem {
        marker-end: none;
        stroke-dasharray: 9 11;
        animation: flow 1.05s linear infinite;
      }
      .hi.pulse {
        animation: node-pulse 2.6s ease-in-out infinite;
      }
      .lbl.flow-lbl {
        animation: lbl-pulse 2.2s ease-in-out infinite;
      }
      .lbl { font-family:Segoe UI,system-ui,sans-serif; font-size:11px; font-weight:700; fill:#111; }
      .foot { font-family:Segoe UI,system-ui,sans-serif; font-size:11.5px; font-weight:600; fill:#3a3a3a; }
      @keyframes flow {
        to { stroke-dashoffset: -20; }
      }
      @keyframes node-pulse {
        0%, 100% { stroke-width: 2.4; }
        50% { stroke-width: 3.4; }
      }
      @keyframes lbl-pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .line, .line.ingest, .line.return, .line.stem, .hi.pulse, .lbl.flow-lbl { animation: none; }
        .line, .line.ingest, .line.return, .line.stem { stroke-dasharray: none; }
      }
    </style>
  </defs>
  <rect class="bg" width="560" height="440"/>

  <text x="24" y="32" class="title">FULL AI FLOW + N8N</text>

  <rect class="b" x="170" y="56" width="220" height="48" rx="10"/>
  <text x="280" y="78" text-anchor="middle" class="lab">Operator</text>
  <text x="280" y="94" text-anchor="middle" class="sub">asks AI to scan a repo</text>
  <line class="line" x1="280" y1="104" x2="280" y2="132"/>

  <rect class="hi" x="150" y="132" width="260" height="56" rx="10"/>
  <text x="280" y="158" text-anchor="middle" class="lab">Orchestrator AI</text>
  <text x="280" y="176" text-anchor="middle" class="sub">full AI conversation path</text>

  <line class="line" x1="280" y1="188" x2="280" y2="218"/>
  <text x="292" y="210" class="lbl">n8n workflow</text>

  <rect class="b" x="150" y="218" width="260" height="54" rx="10"/>
  <text x="280" y="242" text-anchor="middle" class="lab">n8n automation</text>
  <text x="280" y="260" text-anchor="middle" class="sub">wires AI to analysis steps</text>

  <line class="line stem" x1="280" y1="272" x2="280" y2="348"/>
  <path class="line ingest" d="M280 348 H262"/>
  <path class="line return" d="M280 348 H298"/>

  <rect class="b" x="32" y="322" width="230" height="56" rx="10"/>
  <text x="147" y="348" text-anchor="middle" class="lab">Analysis worker</text>
  <text x="147" y="366" text-anchor="middle" class="sub">scans code / builds report</text>

  <rect class="hi pulse" x="298" y="322" width="230" height="56" rx="10"/>
  <text x="413" y="348" text-anchor="middle" class="lab">Structured report</text>
  <text x="413" y="366" text-anchor="middle" class="sub">only this reaches the AI</text>

  <text x="24" y="416" class="foot">Client view: AI scans the codebase. Model never sees raw source trees.</text>

</svg>
